name: MAS Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '37 19 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-agent:
    runs-on: macos-latest
    name: Verify MAS pack, authority handler, and OPL-hosted interfaces
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Checkout and build OPL Framework
        run: |
          git clone --depth=1 --filter=blob:none https://github.com/gaofeng21cn/one-person-lab.git ../one-person-lab
          npm ci --prefix ../one-person-lab --ignore-scripts
          npm run --prefix ../one-person-lab build
          echo "OPL_BIN=$GITHUB_WORKSPACE/../one-person-lab/bin/opl" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Run MAS repository verification
        env:
          OPL_PYTHON_CLIENT_DIR: ${{ github.workspace }}/../one-person-lab/sdks/python-client
        run: scripts/verify.sh full

      - name: Validate v2 package manifest and deterministic build
        run: |
          "$OPL_BIN" pack inspect "$GITHUB_WORKSPACE" --json
          "$OPL_BIN" pack build "$GITHUB_WORKSPACE" --no-write-lock --json

      - name: Build sdist and wheel
        run: uv build --out-dir "${RUNNER_TEMP}/mas-dist"
