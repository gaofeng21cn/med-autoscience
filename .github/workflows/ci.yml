name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source and focused package tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout Framework Python ABI
        uses: actions/checkout@v7
        with:
          repository: gaofeng21cn/one-person-lab
          path: framework
          sparse-checkout: python
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Run source verification
        env:
          OPL_FRAMEWORK_PYTHON_ROOT: ${{ github.workspace }}/framework/python
        run: scripts/verify.sh source
